[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-search"
version = "1.0.0"
description = "A local-first research document search engine with keyword, semantic, and hybrid retrieval."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.40"]
pdf = ["pypdf>=5.0"]
semantic = ["sentence-transformers>=3.0"]
full = ["streamlit>=1.40", "pypdf>=5.0", "sentence-transformers>=3.0"]

[project.scripts]
papertrail = "papertrail.cli:main"
papertrail-app = "papertrail.app:main"

[tool.setuptools.packages.find]
where = ["src"]
